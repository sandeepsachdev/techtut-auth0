spring:
  security:
    oauth2:
      client:
        registration:
          auth0:
            client-id: test-client
            client-secret: test-secret
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          auth0:
            authorization-uri: https://tenant.example.auth0.com/authorize
            token-uri: https://tenant.example.auth0.com/oauth/token
            jwk-set-uri: https://tenant.example.auth0.com/.well-known/jwks.json
            user-info-uri: https://tenant.example.auth0.com/userinfo
            user-name-attribute: sub
      resourceserver:
        jwt:
          jwk-set-uri: https://tenant.example.auth0.com/.well-known/jwks.json
app:
  step-up:
    max-age: 10m
