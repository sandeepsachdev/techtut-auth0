<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Auth0 Step-Up Demo'">Auth0 Step-Up Demo</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="header" class="site-header">
    <a class="skip-link" href="#main">Skip to main content</a>
    <div class="container header-inner">
        <a class="brand" th:href="@{/}">Auth0 Step-Up Demo</a>
        <nav aria-label="Main" class="nav">
            <th:block sec:authorize="isAuthenticated()">
                <a th:href="@{/profile}">Profile</a>
                <a th:href="@{/account/security}">Security settings</a>
                <a th:href="@{/payments}">Payments</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="link-button">Log out</button>
                </form>
            </th:block>
            <a sec:authorize="!isAuthenticated()" class="button" th:href="@{/oauth2/authorization/auth0}">Log in</a>
        </nav>
    </div>
</header>
</body>
</html>
